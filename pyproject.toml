[build-system]
# 77: SPDX `license` expression and `license-files` (PEP 639).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-trainer"
version = "0.2.0"
description = "Anima LoRA Studio: desktop LoRA trainer for the Anima diffusion model, based on Citron's Anima LoRA Trainer UI"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Mauro Liistro" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pydantic>=2.7,<3",
    # Same writer as Citron, so generated TOML files match byte for byte.
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-toml>=0.10",
]

[project.scripts]
anima-trainer = "anima_trainer.cli.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The app icon (window and menu entry).
"anima_trainer.ui" = ["assets/*.svg"]
# The built-in training presets.
"anima_trainer.presets" = ["builtin/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that spawn subprocesses or touch the filesystem",
    "e2e: end-to-end tests driving the Qt UI",
    "runtime: tests running scripts in an installed training venv (ANIMA_TRAINER_TEST_RUNTIME)",
]
qt_api = "pyside6"

[tool.coverage.run]
source = ["anima_trainer"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
# runtime_scripts run in the training venv (torch); tests/runtime_scripts covers them.
omit = ["*/ui/*", "*/main.py", "*/runtime_scripts/*"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src"]
# Needs torch and sd-scripts, which only the training venv has.
exclude = ["src/anima_trainer/runtime_scripts/"]
strict = true
warn_unreachable = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# Stand-in executables for subprocess tests talk to the runner through stdout.
"tests/fixtures/*.py" = ["T201"]
"tests/runtime_scripts/check_*.py" = ["T201"]
# Scripts run by the training venv report to the app through stdout, like sd-scripts.
"src/anima_trainer/runtime_scripts/*.py" = ["T201"]
