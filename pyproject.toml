[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-trainer"
version = "0.1.0"
description = "Desktop LoRA trainer for the Anima diffusion model, based on Citron's Anima LoRA Trainer UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pydantic>=2.7,<3",
    # Same writer as Citron, so generated TOML files match byte for byte.
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
anima-trainer = "anima_trainer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that spawn subprocesses or touch the filesystem",
    "e2e: end-to-end tests driving the Qt UI",
]
qt_api = "pyside6"

[tool.coverage.run]
source = ["anima_trainer"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = ["*/ui/*", "*/main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]
