<?xml version="1.0" encoding="UTF-8"?>
<!-- Anima LoRA Studio icon. Original artwork, GPL-3.0-or-later like the app. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4bd8"/>
      <stop offset="1" stop-color="#2a1d6b"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9cffd"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#background)"/>
  <!-- The letter A: two legs and a crossbar, drawn as round strokes. -->
