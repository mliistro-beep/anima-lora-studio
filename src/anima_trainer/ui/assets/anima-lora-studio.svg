        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 150 L154 150" fill="none" stroke="url(#letter)" stroke-width="24"
        stroke-linecap="round"/>
  <!-- A sparkle: the generated preview. -->
  <path d="M196 44 C199 64 204 69 224 72 C204 75 199 80 196 100 C193 80 188 75 168 72
